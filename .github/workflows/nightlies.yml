name: Make Debug (ARM64)

permissions:
  contents: write

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'adopt'
          java-version: 17
          cache: 'gradle'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # 🧱 Build only the ARM64 debug APK
      - name: Build ARM64 Debug APK
        run: ./gradlew assembleArm64v8aDebug

      # 🗂 Rename and prepare the artifact
      - name: Prepare artifact
        run: |
          set -e
          commit_count=$(git rev-list --count HEAD)
          echo "COMMIT_COUNT=$commit_count" >> $GITHUB_ENV
          mkdir -p output
          cp app/build/outputs/apk/arm64-v8a/debug/app-arm64-v8a-debug.apk output/mpvKt-arm64-debug.apk

      # 📤 Upload just the ARM64 debug APK
      - name: Upload ARM64 APK
        uses: actions/upload-artifact@v4
        with:
          name: arm64-debug-r${{ env.COMMIT_COUNT }}
          path: output/mpvKt-arm64-debug.apk
